$kind: http-request
url: "{{base_url}}/api/products.php?q=mouse&page=1&limit=10"
method: GET
queryParams:
  q: mouse
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Search returns an array', function () { pm.expect(pm.response.json().data).to.be.an('array'); });
    language: text/javascript
order: 2000
