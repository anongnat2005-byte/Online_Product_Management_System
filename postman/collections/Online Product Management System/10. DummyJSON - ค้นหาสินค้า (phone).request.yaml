$kind: http-request
url: "{{base_url}}/api/dummyjson.php?action=search&q=phone"
method: GET
queryParams:
  action: search
  q: phone
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Products returned from DummyJSON', function () { pm.expect(pm.response.json().data).to.be.an('array'); });
    language: text/javascript
order: 10000
